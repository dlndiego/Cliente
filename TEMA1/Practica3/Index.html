<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS OBJETOS PREDEFINIDOS</title>
    <link rel="stylesheet" href="CSS/index.css">
</head>
<body>
    <section>
        <h1>OBJETOS NATIVOS</h1>
    </section>
    <section class="ej1">
        <h2> 1. CONVERSIONES DE CADENAS</h2>
        <article>
            <LAbel>Introduce una cadena de texto: </LAbel>
            <input type="text" id="cadenaSuministrada">
            <br>
            <button id="btnObtener">ENVIAR CADENA</button>
            <br>
            <LAbel>Cadena invertida: </LAbel>
            <input type="text" class="Texto1">
            <br>
            <LAbel>Cadena en mayusculas: </LAbel>
            <input type="text" class="Texto1">
            <br>
            <LAbel>Cadena repetida: </LAbel>
            <input type="text" class="Texto1">
            <br>
            <LAbel>Invertida en mayusculas: </LAbel>
            <input type="text" class="Texto1">
        </article>
    </section>
    <section class="ej2">
        <h2> 2. LETRAS DE CADENA EN TABLA</h2>
        <table>
            <tr>
                <td class="letras">X</td>
                <td class="letras">X</td>
                <td class="letras">X</td>
                <td class="letras">X</td>
            </tr>
        </table>
    </section>
    <section class="ej2">
        <h2> 3. LETRAS DE CADENA EN TABLA EN MAYUSCULAS</h2>
        <table>
            <tr>
                <td class="letras1">X</td>
                <td class="letras1">X</td>
                <td class="letras1">X</td>
                <td class="letras1">X</td>
            </tr>
        </table>
    </section>

</body>
<script src="JS/JS3.js"></script>
</html>
